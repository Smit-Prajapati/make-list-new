<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make List</title>
    <link rel="stylesheet" href="css/style.css">
    <link id="favicon" rel="icon" href="assets/images/check-mark.png" type="image/png">
    <script type="module" src="js/pages/list/list.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
</head>

<body>
    <div class="container" id="container">

        <!-- ── Top bar: logo + optional gujarati toggle ── -->
        <div class="topbar" id="topbar"></div>

        <!-- ── Tab bar (hidden when page has no tabs) ── -->
        <div class="tab-bar" id="tab-bar" style="display:none;"></div>

        <!-- ── View switcher (list / card / grid2) ── -->
        <div class="view-switcher" id="view-switcher"></div>

        <!-- ── Checkbox item list ── -->
        <div class="list-container" id="list-container"></div>

        <!-- ── Floating action buttons: Add item + Preview grouped in a pill,
             Share as the separate primary action (opens the same preview) ── -->
        <div class="floating-actions">
            <div class="nav-pill">
                <button id="add-item-button" class="nav-pill-btn" title="Add item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14" />
                        <path d="M12 5v14" />
                    </svg>
                    <span>Add</span>
                </button>
                <button id="preview-button" class="nav-pill-btn" title="Preview">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
                        <circle cx="12" cy="12" r="3" />
                    </svg>
                    <span>Preview</span>
                </button>
            </div>
            <button id="share-button" class="button share-button" title="Share list">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="18" cy="5" r="3" />
                    <circle cx="6" cy="12" r="3" />
                    <circle cx="18" cy="19" r="3" />
                    <line x1="8.59" y1="13.51" x2="15.42" y2="17.49" />
                    <line x1="15.41" y1="6.51" x2="8.59" y2="10.49" />
                </svg>
            </button>
        </div>

        <!-- ── Add item popup (form rendered by js/pages/list/addItemPopup.js) ── -->
        <div class="popup-container" id="add-item-popup-container"></div>

        <!-- ── Share popup: name input, show-images toggle, preview card and
             Download/Share/Copy actions (rendered by js/pages/list/sharePopup.js) ── -->
        <div class="popup-container" id="share-popup-container"></div>

        <!-- ── Snackbar (toast) notifications ── -->
        <div class="snackbar-container" id="snackbar-container"></div>

    </div>
</body>

</html>
